# Copy to docker-compose.yml and edit. Your real docker-compose.yml is git-ignored.
services:
  lol-meta-collector:
    build: .
    container_name: lol-meta-collector
    restart: unless-stopped
    command: ["python", "-m", "lolmeta", "schedule", "--interval-days", "7"]
    volumes:
      # The collector WRITES here. The tracker mounts the same host folder read-only at /collector.
      # Keep this identical to COLLECTOR_DATA_DIR in the tracker's compose file.
      - ${COLLECTOR_DATA_DIR:-./data}:/app/data
      - ./logs:/app/logs
      - ./config.json:/app/config.json:ro
    environment:
      TZ: Africa/Johannesburg                    # change to your timezone; the schedule runs around 03:15 local time
